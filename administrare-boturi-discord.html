<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel Pro Bot · Dashboard</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="icon" href="img/favicon.ico">
  <style>
    :root{color-scheme:dark}.app-shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 70% 0%,#102542 0,#020617 42%,#020617 100%)}.app-header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 26px;border-bottom:1px solid #1e3552;background:#050d1aee;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px;font-weight:950}.brand img{width:34px;height:34px;border-radius:10px}.brand small{display:block;color:#67e8f9;font-size:9px;letter-spacing:.16em;text-transform:uppercase}.header-status{color:#8fa3bb;font-size:11px}.sidebar{grid-row:2/4;padding:22px 14px;border-right:1px solid #1e3552;background:#071222}.side-title{padding:0 11px 14px;color:#647b96;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.side-nav{display:grid;gap:6px}.side-nav a{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid transparent;border-radius:11px;color:#a9bad0;font-size:12px;font-weight:800}.side-nav a:hover,.side-nav a.active{border-color:#24516d;background:#0d2b43;color:#cffafe}.side-nav a.active{box-shadow:inset 3px 0 #22d3ee}.side-divider{height:1px;margin:20px 10px;background:#1c3048}.content{min-width:0;padding:28px clamp(16px,3vw,38px)}.bot-admin-hero,.bot-card,.toolbar-card{border:1px solid #263b58;border-radius:22px;background:linear-gradient(145deg,#101c31,#091222);box-shadow:0 18px 55px #02061766}.bot-admin-hero{display:flex;justify-content:space-between;gap:20px;padding:26px}.eyebrow{color:#67e8f9;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.bot-admin-hero h1{margin-top:6px;font-size:clamp(24px,3vw,38px);font-weight:950}.bot-admin-hero p{max-width:780px;margin-top:8px;color:#9fb0c5;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;justify-content:flex-end}.button{border:1px solid #36516f;border-radius:12px;background:#12243a;color:#e2e8f0;padding:10px 14px;font-size:12px;font-weight:900;cursor:pointer}.button:hover{border-color:#67e8f9;background:#173454}.button.primary{border-color:#10b981;background:#047857;color:#ecfdf5}.button.cyan{border-color:#22d3ee;background:#0e3545;color:#cffafe}.status{min-height:22px;margin:14px 2px;color:#94a3b8;font-size:12px}.status.error{color:#fda4af}.status.ok{color:#6ee7b7}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}.toolbar input{flex:1 1 280px;border:1px solid #334155;border-radius:12px;background:#07101f;color:#e2e8f0;padding:11px 13px;outline:none}.toolbar input:focus{border-color:#22d3ee}.bot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.bot-card{padding:18px}.bot-card h2{font-size:17px;font-weight:950}.bot-card .meta{margin-top:5px;color:#8fa3bb;font-size:11px;line-height:1.6}.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.badge{border:1px solid #304762;border-radius:999px;padding:5px 9px;color:#cbd5e1;font-size:10px;font-weight:800}.badge.live{border-color:#10b98155;background:#064e3b;color:#a7f3d0}.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.empty{border:1px dashed #334155;border-radius:18px;padding:35px;text-align:center;color:#94a3b8}.app-footer{grid-column:2;padding:18px 30px;border-top:1px solid #1e3552;color:#71859f;font-size:11px;display:flex;justify-content:space-between;gap:12px}.app-footer strong{color:#67e8f9}@media(max-width:900px){.app-shell{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}.sidebar{grid-row:auto;border-right:0;border-bottom:1px solid #1e3552;padding:10px 14px}.side-title{display:none}.side-nav{display:flex;overflow:auto}.side-nav a{white-space:nowrap}.side-divider{display:none}.content{padding:18px 14px}.app-footer{grid-column:1;padding:16px 14px;flex-direction:column}.bot-admin-hero{flex-direction:column}.actions{justify-content:flex-start}.bot-grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="app-shell">
    <header id="bot-header" class="app-header"></header>
    <aside id="bot-sidebar" class="sidebar"></aside>
    <main class="content">
    <section class="bot-admin-hero"><div><p class="eyebrow">Panel Pro Bot · Discord-only</p><h1>Serverul meu Discord</h1><p>Configurează serverul în care este instalat botul: canale pentru embeduri, canale de log, roluri de acces și modulele disponibile.</p></div></section>
    <p id="status" class="status" role="status">Se încarcă serverele Discord…</p>
    <section class="toolbar-card"><div class="toolbar"><input id="search" type="search" placeholder="Caută după server, Guild ID sau organizație…" autocomplete="off"><button id="refresh" class="button primary" type="button">↻ Actualizează</button></div></section>
    <section id="list" class="bot-grid"><div class="empty">Se încarcă registrul boturilor…</div></section>
    </main>
    <footer id="bot-footer" class="app-footer"></footer>
  </div>
  <script src="js/bot-layout.js?v=20260904-layout2" defer></script>
  <script src="js/bot-servers.js?v=20260904-server-dashboard2"></script>
</body>
</html>
