  <style>
    :root{color-scheme:dark}.app-shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 70% 0%,#102542 0,#020617 42%,#020617 100%)}

    .hero,.panel,.org-card,.toolbar-card{border:1px solid #263b58;border-radius:20px;background:linear-gradient(145deg,#101c31,#091222);box-shadow:0 18px 55px #02061755}.hero{display:flex;justify-content:space-between;gap:20px;padding:25px}.eyebrow{color:#67e8f9;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.hero h1{margin-top:6px;font-size:clamp(26px,3vw,38px);font-weight:950}.muted{color:#9fb0c5;line-height:1.55}.status{min-height:22px;margin:14px 2px;color:#94a3b8;font-size:12px}.status.error{color:#fda4af}.status.ok{color:#6ee7b7}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.toolbar input,.field{border:1px solid #334155;border-radius:11px;background:#07101f;color:#e2e8f0;padding:10px 12px}.toolbar input{flex:1 1 260px}.button{border:1px solid #36516f;border-radius:11px;background:#12243a;color:#e2e8f0;padding:10px 14px;font-size:12px;font-weight:900;cursor:pointer}.button:hover{border-color:#67e8f9;background:#173454}.button.primary{background:#047857;border-color:#10b981}.button.cyan{background:#0e3545;border-color:#22d3ee}.button.danger{background:#3f1725;border-color:#fb7185;color:#fecdd3}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;margin-top:18px;align-items:start}.org-list{padding:14px;position:sticky;top:84px}.org-list h2{font-size:14px;font-weight:950;margin-bottom:10px}.org-items{display:grid;gap:8px}.org-card{padding:13px;cursor:pointer;border-color:transparent;box-shadow:none}.org-card:hover,.org-card.active{border-color:#22d3ee;background:#123657}.org-card h3{font-size:14px;font-weight:900}.org-card small{display:block;color:#8fa3bb;margin-top:4px;font-size:10px}.org-card .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#10b981;margin-right:6px}.org-card .dot.warn{background:#f59e0b}.editor{min-width:0}.editor-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:20px}.editor-head h2{font-size:22px;font-weight:950}.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.badge{border:1px solid #304762;border-radius:999px;padding:5px 9px;color:#cbd5e1;font-size:10px;font-weight:800}.badge.live{border-color:#10b98155;background:#064e3b;color:#a7f3d0}.section{margin-top:14px;padding:18px}.section h3{font-size:16px;font-weight:950}.section-title{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.label{display:block;color:#9fb0c5;font-size:11px;font-weight:800}.label .field{display:block;width:100%;margin-top:6px}.role-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.check{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #263b58;border-radius:10px;background:#071222;color:#dbeafe;font-size:12px}.check input{accent-color:#22d3ee}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.module{border:1px solid #263b58;border-radius:14px;background:#0b1729;padding:14px}.module h4{font-size:14px;font-weight:900}.module p{margin-top:6px;color:#8fa3bb;font-size:11px;line-height:1.45}.module-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.module-actions .button{padding:8px 10px;font-size:10px}.module-status{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.module-status span{font-size:10px;color:#a7f3d0;background:#064e3b;border:1px solid #10b98155;border-radius:999px;padding:4px 7px}.module-status span.off{color:#cbd5e1;background:#1e293b;border-color:#475569}.empty{border:1px dashed #334155;border-radius:16px;padding:35px;text-align:center;color:#94a3b8}.app-footer{grid-column:2;padding:18px 30px;border-top:1px solid #1e3552;color:#71859f;font-size:11px;display:flex;justify-content:space-between;gap:12px}@media(max-width:980px){.layout{grid-template-columns:1fr}.org-list{position:static}.org-items{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px)   <div class="app-shell">
    <header id="bot-header" class="app-header"></header>

      <section class="hero"><div><p class="eyebrow">Panel Pro Bot · administrare</p><h1>Organizații</h1><p class="muted">Gestionează separat fiecare server Discord autorizat: identitatea organizației, rolurile administrative, modulele și accesul lor.</p></div><a class="button cyan" href="administrare-boturi-discord.html">← Serverele mele</a></section>
