<!doctype html><html lang="ro" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Pro Bot · Configurare globală</title><link rel="stylesheet" href="css/tailwind.css"><style>:root{color-scheme:dark}.app-shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr auto;background:#020617}.app-header{grid-column:1/-1;display:flex;justify-content:space-between;padding:16px 26px;border-bottom:1px solid #1e3552;background:#050d1a}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.brand img{width:34px;border-radius:10px}.brand small{display:block;color:#67e8f9;font-size:9px}.sidebar{grid-row:2/4;padding:22px 14px;border-right:1px solid #1e3552;background:#071222}.side-nav{display:grid;gap:6px}.side-nav a{padding:11px;border-radius:11px;color:#a9bad0;font-size:12px;font-weight:800}.side-nav a.active,.side-nav a:hover{background:#0d2b43;color:#cffafe}.side-title{color:#647b96;font-size:10px;font-weight:900;text-transform:uppercase;padding:0 11px 14px}.side-divider{height:1px;background:#1c3048;margin:20px 10px}.content{padding:28px;min-width:0}.hero,.module{border:1px solid #263b58;border-radius:18px;background:linear-gradient(145deg,#101c31,#091222);padding:20px}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:#67e8f9;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:30px;font-weight:950}.hero p{color:#9fb0c5;margin-top:7px}.button{border:1px solid #36516f;border-radius:10px;background:#12243a;color:#e2e8f0;padding:10px 14px;font-weight:900;cursor:pointer}.button.primary{background:#047857;border-color:#10b981}.status{min-height:22px;margin:14px 2px;color:#94a3b8}.status.error{color:#fda4af}.status.ok{color:#6ee7b7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.module h2{font-size:17px;font-weight:950;margin-bottom:12px}.field{display:grid;gap:6px;margin-top:10px}.field label{color:#9fb0c5;font-size:11px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid #334155;border-radius:9px;background:#07101f;color:#e2e8f0;padding:9px;outline:none}.field textarea{min-height:78px;resize:vertical}.buttons{margin-top:14px;padding-top:10px;border-top:1px solid #263b58}.button-row{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-top:7px}.app-footer{grid-column:2;padding:18px 30px;border-top:1px solid #1e3552;color:#71859f;font-size:11px;display:flex;justify-content:space-between}@media(max-width:900px){.app-shell{grid-template-columns:1fr}.sidebar{grid-row:auto}.app-footer{grid-column:1}.hero{flex-direction:column}.grid{grid-template-columns:1fr}.content{padding:16px}}</style></head><body><div class="app-shell"><header id="bot-header" class="app-header"></header><aside id="bot-sidebar" class="sidebar"></aside><main class="content"><section class="hero"><div><p class="eyebrow">Panel Pro Bot · administrator global</p><h1>Configurare globală</h1><p>Editează embedurile și butoanele folosite de botul publicat în Discord, pentru toate serverele configurate.</p></div><button id="save" class="button primary" type="button">💾 Salvează setările globale</button></section><p id="status" class="status">Se încarcă modulele…</p><section id="modules" class="grid"></section></main><footer id="bot-footer" class="app-footer"></footer></div><script src="js/bot-layout.js?v=20260904-layout" defer></script><script src="js/bot-global-config.js?v=20260904-global" defer></script></body></html>
