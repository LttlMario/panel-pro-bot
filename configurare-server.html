<!doctype html><html lang="ro" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.ico"><title>Panel Pro Bot · Configurare server</title><link rel="stylesheet" href="css/tailwind.css"><style>body{background:#020617;color:#e2e8f0}.app-shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:auto 1fr auto}.app-header{grid-column:1/-1;padding:16px 26px;border-bottom:1px solid #1e3552;background:#050d1a}.sidebar{grid-row:2/4;padding:22px 14px;border-right:1px solid #1e3552;background:#071222}.content{padding:28px;min-width:0}.hero,.panel{border:1px solid #263b58;border-radius:18px;background:linear-gradient(145deg,#101c31,#091222);padding:20px}.hero h1{font-size:30px;font-weight:950}.muted{color:#9fb0c5}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.button{border:1px solid #36516f;border-radius:10px;background:#12243a;color:#e2e8f0;padding:10px 14px;font-size:12px;font-weight:900;cursor:pointer}.button.primary{background:#047857;border-color:#10b981}.button.cyan{background:#0e3545;border-color:#22d3ee}.field{width:100%;margin-top:6px;padding:10px;border:1px solid #334155;border-radius:9px;background:#07101f;color:#e2e8f0}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.module{border:1px solid #263b58;border-radius:14px;background:#0b1729;padding:16px}.module h2{font-size:16px;font-weight:900}.module label{display:block;margin-top:12px;color:#94a3b8;font-size:11px}.status{min-height:22px;margin:12px 0;color:#94a3b8}.status.error{color:#fda4af}.status.ok{color:#6ee7b7}.app-footer{grid-column:2;padding:18px 30px;border-top:1px solid #1e3552;color:#71859f;font-size:11px;display:flex;justify-content:space-between}@media(max-width:850px){.app-shell{grid-template-columns:1fr}.sidebar{grid-row:auto}.content{padding:18px 14px}.app-footer{grid-column:1}.modules{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><header id="bot-header" class="app-header"></header><aside id="bot-sidebar" class="sidebar"></aside><main class="content"><section class="hero"><p class="muted">Panel Pro Bot · serverul meu</p><h1 id="title">Configurare server Discord</h1><p class="muted">Alege canalele pentru embeduri și loguri. Setările se aplică doar serverului selectat și folosesc sesiunea Discord deja existentă.</p></section><div class="toolbar"><a class="button" href="administrare-boturi-discord.html">← Înapoi la dashboard</a><button id="save" class="button primary" type="button" disabled>Salvează setările</button></div><p id="status" class="status">Se încarcă serverul…</p><section id="modules" class="modules"></section></main><footer id="bot-footer" class="app-footer"></footer></div><script src="js/bot-layout.js?v=20260904-layout" defer></script><script>
(()=>{const API='https://zrjxlbkbctlapgupktxw.supabase.co/functions/v1/manage-discord-bot',KEY='sb_publishable_LfngX7pwFruPw35_ZUdO4Q_MGAHoeW0',APP='1531023771211792384',$=id=>document.getElementById(id),token=()=>sessionStorage.getItem('discovery_access_token')||sessionStorage.getItem('discord_bot_admin_token')||'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),guildId=new URLSearchParams(location.search).get('guild_id')||'',state={guild:null,modules:{},channels:[],routes:{}};const status=(m,k='')=>{$('status').textContent=m;$('status').className=`status ${k}`};const call=async body=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:`Bearer ${KEY}`},body:JSON.stringify({...body,access_token:token(),application_id:APP})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Cererea nu a putut fi finalizată.');return d};const options=selected=>`<option value="">Fără canal selectat</option>${state.channels.map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(selected||'')?'selected':''}>#${esc(c.name)}${c.category_name?' · '+esc(c.category_name):''}</option>`).join('')}`;const render=()=>{$('title').textContent=`Configurare ${state.guild.name||'server Discord'}`;$('modules').innerHTML=Object.entries(state.modules).map(([key,m])=>{const locked=m.premium&&state.guild.plan==='free',embed=state.routes?.[key]?.primary?.channel_id||'',log=m.log_key?state.routes?.[m.log_key]?.primary?.channel_id||'':'';return `<article class="module"><h2>${esc(m.label)}</h2><p class="muted">${locked?'Disponibil în Trial sau Premium.':'Alege canalul embedului și canalul de log.'}</p><label>Canal embed<select class="field" data-key="${esc(key)}" data-kind="embed" ${locked?'disabled':''}>${options(embed)}</select></label>${m.log_key?`<label>Canal log<select class="field" data-key="${esc(key)}" data-kind="log" ${locked?'disabled':''}>${options(log)}</select></label>`:''}<button class="button cyan mt-3" data-publish="${esc(key)}" ${locked||!embed?'disabled':''}>📌 Publică / actualizează</button></article>`}).join('');document.querySelectorAll('[data-key]').forEach(x=>x.onchange=()=>{state.routes[x.dataset.key]??={};state.routes[x.dataset.key].primary??={};const k=x.dataset.key;if(x.dataset.kind==='embed')state.routes[k].primary.channel_id=x.value;else{const log=state.modules[k].log_key;if(log){state.routes[log]??={};state.routes[log].primary??={};state.routes[log].primary.channel_id=x.value}}$('save').disabled=false;const b=document.querySelector(`[data-publish="${k}"]`);if(b)b.disabled=!state.routes[k]?.primary?.channel_id});document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{try{await save(false);await call({action:'publish',guild_id:guildId,module:b.dataset.publish});status('Embedul a fost publicat sau actualizat pe Discord.','ok')}catch(e){status(e.message,'error')}})};const save=async(show=true)=>{const routes={};Object.entries(state.modules).forEach(([k,m])=>{routes[k]={embed:state.routes?.[k]?.primary?.channel_id||'',log:m.log_key?state.routes?.[m.log_key]?.primary?.channel_id||'':''}});const d=await call({action:'save',guild_id:guildId,routes});state.routes=d.routes||state.routes;$('save').disabled=true;render();if(show)status('Setările serverului au fost salvate.','ok')};$('save').onclick=()=>save(true);(async()=>{try{if(!guildId)throw Error('Serverul Discord nu a fost specificat.');const d=await call({action:'bootstrap',view_scope:'personal'});state.guild=(d.guilds||[]).find(g=>String(g.id)===String(guildId));if(!state.guild)throw Error('Nu ai acces la acest server Discord.');state.modules=d.modules||{};const c=await call({action:'channels',guild_id:guildId});state.channels=c.channels||[];state.routes=c.routes||{};render();status(`Configurezi serverul ${state.guild.name}.`,'ok');$('save').disabled=false}catch(e){status(e.message,'error');$('modules').innerHTML=`<div class="panel">${esc(e.message)}</div>`}})()})();
</script></body></html>
