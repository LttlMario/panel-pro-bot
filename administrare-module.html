<!doctype html><html lang="ro" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.ico"><title>Panel Pro Bot · Module</title><link rel="stylesheet" href="css/tailwind.css"><style>body{margin:0;background:#020617;color:#e2e8f0;font-family:Inter,Segoe UI,Arial,sans-serif}.app-shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:auto 1fr auto}.app-header{grid-column:1/-1;padding:16px 26px;border-bottom:1px solid #1e3552;background:#050d1a}.sidebar{grid-row:2/4;padding:22px 14px;border-right:1px solid #1e3552;background:#071222}.content{padding:28px;min-width:0}.hero,.panel{border:1px solid #263b58;border-radius:18px;background:linear-gradient(145deg,#101c31,#091222);padding:20px}.hero h1{font-size:28px;font-weight:950}.muted{color:#9fb0c5}.grid{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(420px,1.2fr);gap:14px;margin-top:18px}.list{display:grid;gap:8px;align-content:start}.module-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid #263b58;border-radius:11px;background:#0b1729}.module-item.active{border-color:#22d3ee;background:#0e2938}.module-item button{border:0;background:transparent;color:#e2e8f0;text-align:left;cursor:pointer}.field{display:grid;gap:6px;margin-top:11px;color:#9fb0c5;font-size:11px}.field input,.field textarea,.field select{width:100%;border:1px solid #334155;border-radius:9px;background:#07101f;color:#e2e8f0;padding:9px}.field textarea{min-height:80px;resize:vertical}.buttons{display:grid;gap:7px;margin-top:14px}.button-row{display:grid;grid-template-columns:1fr 100px;gap:7px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.button{border:1px solid #36516f;border-radius:10px;background:#12243a;color:#e2e8f0;padding:10px 13px;font-size:12px;font-weight:900;cursor:pointer}.primary{background:#047857;border-color:#10b981}.cyan{background:#0e3545;border-color:#22d3ee}.danger{border-color:#7f1d1d;background:#3b1118}.status{min-height:22px;margin:14px 2px;color:#94a3b8}.ok{color:#6ee7b7}.error{color:#fda4af}.app-footer{grid-column:2;padding:18px 30px;border-top:1px solid #1e3552;color:#71859f;font-size:11px;display:flex;justify-content:space-between}@media(max-width:900px){.app-shell{grid-template-columns:1fr}.sidebar{grid-row:auto}.content{padding:16px}.app-footer{grid-column:1}.grid{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><header id="bot-header" class="app-header"></header><aside id="bot-sidebar" class="sidebar"></aside><main class="content"><section class="hero"><p class="muted">Panel Pro Bot · administrator global</p><h1>Constructor module</h1><p class="muted">Creează module noi cu embed, butoane, handler și canal de log. Setările sunt globale; publicarea se face pe serverul ales.</p></section><p id="status" class="status">Se încarcă modulele…</p><div class="grid"><section class="panel"><div class="actions" style="margin-top:0"><button id="new" class="button primary" type="button">＋ Modul nou</button><button id="save-all" class="button" type="button">💾 Salvează modulele</button></div><div id="list" class="list" style="margin-top:14px"></div></section><section id="editor" class="panel"><h2 id="editor-title">Selectează un modul</h2><div class="field"><label>Cheie internă</label><input id="key" placeholder="custom_recrutare"></div><div class="field"><label>Nume modul</label><input id="label" placeholder="Recrutare"></div><div class="field"><label>Titlu embed</label><input id="title" placeholder="📋 Recrutare"></div><div class="field"><label>Descriere embed</label><textarea id="description" placeholder="Descrierea modulului afișată pe Discord"></textarea></div><div class="field"><label>Culoare embed</label><input id="color" type="color" value="#5865f2"></div><div class="field"><label>Funcție / handler</label><select id="handler"><option value="none">Doar embed (handler viitor)</option><option value="announcement">Anunț / comunicare</option><option value="request">Cerere / formular</option><option value="approval">Aprobare administrativă</option><option value="report">Raport / export</option></select></div><div class="buttons"><label>Butoane Discord (maximum 5)</label><div id="button-list"></div><button id="add-button" class="button" type="button">＋ Adaugă buton</button></div><div class="field"><label>Server pentru publicare</label><select id="guild"><option value="">Selectează serverul</option></select></div><div class="field"><label>Canal embed</label><select id="embed-channel"><option value="">Încarcă serverul mai întâi</option></select></div><div class="field"><label>Canal log</label><select id="log-channel"><option value="">Încarcă serverul mai întâi</option></select></div><div class="actions"><button id="publish" class="button cyan" type="button">📌 Salvează și publică pe Discord</button><button id="delete" class="button danger" type="button">🗑️ Șterge modulul</button></div></section></div></main><footer id="bot-footer" class="app-footer"></footer></div><script src="js/bot-layout.js?v=20260904-layout" defer></script><script>
(()=>{const API='https://zrjxlbkbctlapgupktxw.supabase.co/functions/v1/manage-discord-bot',KEY='sb_publishable_LfngX7pwFruPw35_ZUdO4Q_MGAHoeW0',APP='1531023771211792384',$=id=>document.getElementById(id),token=()=>sessionStorage.getItem('discovery_access_token')||sessionStorage.getItem('discord_bot_admin_token')||'',state={modules:{},guilds:[],channels:[],selected:''};const status=(m,k='')=>{$('status').textContent=m;$('status').className=`status ${k}`};const call=async body=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:`Bearer ${KEY}`},body:JSON.stringify({...body,access_token:token(),application_id:APP})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Cererea nu a putut fi finalizată.');return d};const key=()=>{let k=$('key').value.trim().toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'');return k.startsWith('custom_')?k:`custom_${k||'modul'}`};const current=()=>state.modules[state.selected]||{key:state.selected||'custom_modul',label:'',title:'',description:'',color:0x5865f2,handler:'none',buttons:[]};const renderButtons=buttons=>{$('button-list').innerHTML=(buttons||[]).map((b,i)=>`<div class="button-row"><input data-blabel="${i}" value="${String(b.label||'').replace(/"/g,'&quot;')}" placeholder="Etichetă buton"><select data-bstyle="${i}"><option value="1" ${Number(b.style)===1?'selected':''}>Albastru</option><option value="2" ${Number(b.style)===2?'selected':''}>Gri</option><option value="3" ${Number(b.style)===3?'selected':''}>Verde</option><option value="4" ${Number(b.style)===4?'selected':''}>Roșu</option></select></div>`).join('')};const renderList=()=>{$('list').innerHTML=Object.values(state.modules).map(m=>`<div class="module-item ${m.key===state.selected?'active':''}"><button data-select="${m.key}"><strong>${m.label||m.key}</strong><br><small class="muted">${m.handler||'none'} · ${m.buttons?.length||0} butoane</small></button></div>`).join('')||'<p class="muted">Nu există module personalizate.</p>';document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>select(b.dataset.select))};const select=k=>{state.selected=k;const m=current();$('editor-title').textContent=`Editează ${m.label||k}`;$('key').value=m.key;$('label').value=m.label||'';$('title').value=m.title||'';$('description').value=m.description||'';$('color').value='#'+Number(m.color||0).toString(16).padStart(6,'0');$('handler').value=m.handler||'none';renderButtons(m.buttons);renderList()};const collect=()=>{const k=key();return {key:k,label:$('label').value.trim(),title:$('title').value.trim(),description:$('description').value.trim(),color:parseInt($('color').value.slice(1),16),handler:$('handler').value,buttons:[...document.querySelectorAll('[data-blabel]')].map((x,i)=>({label:x.value.trim(),style:Number(document.querySelector(`[data-bstyle="${i}"]`).value)})).filter(x=>x.label)}};const options=items=>'<option value="">Selectează canalul</option>'+items.map(c=>`<option value="${c.id}">#${c.name}${c.category_name?' · '+c.category_name:''}</option>`).join('');const loadChannels=async()=>{const gid=$('guild').value;if(!gid)return;const d=await call({action:'channels',guild_id:gid});state.channels=d.channels||[];$('embed-channel').innerHTML=options(state.channels);$('log-channel').innerHTML=options(state.channels)};$('guild').onchange=loadChannels;$('new').onclick=()=>{const k='custom_modul_'+(Object.keys(state.modules).length+1);state.modules[k]={key:k,label:'Modul nou',title:'Modul nou',description:'',color:0x5865f2,handler:'none',buttons:[]};select(k)};$('add-button').onclick=()=>{const m=collect();if(document.querySelectorAll('[data-blabel]').length>=5)return status('Poți adăuga maximum 5 butoane.','error');m.buttons.push({label:'Buton nou',style:1});renderButtons(m.buttons)};$('save-all').onclick=async()=>{try{const m=collect();if(state.selected){delete state.modules[state.selected];state.modules[m.key]=m;state.selected=m.key}await call({action:'save_custom_modules',custom_modules:state.modules});status('Modulele au fost salvate în baza Discovery.','ok');renderList()}catch(e){status(e.message,'error')}};$('delete').onclick=async()=>{if(!state.selected)return;delete state.modules[state.selected];state.selected='';await call({action:'save_custom_modules',custom_modules:state.modules});$('editor-title').textContent='Selectează un modul';renderList();status('Modulul a fost șters.','ok')};$('publish').onclick=async()=>{try{const m=collect();if(!m.label||!m.title||!$('guild').value||!$('embed-channel').value)throw Error('Completează modulul, serverul și canalul embed.');state.modules[m.key]=m;state.selected=m.key;await call({action:'save_custom_modules',custom_modules:state.modules});await call({action:'publish_custom_module',guild_id:$('guild').value,module_key:m.key,embed_channel_id:$('embed-channel').value,log_channel_id:$('log-channel').value});status('Modulul a fost salvat și publicat/actualizat pe Discord.','ok');renderList()}catch(e){status(e.message,'error')}};(async()=>{try{const [b,c]=await Promise.all([call({action:'bootstrap'}),call({action:'custom_modules'})]);if(!b.platform_admin)throw Error('Acces permis doar administratorului global.');state.guilds=b.guilds||[];state.modules=c.custom_modules||{};$('guild').innerHTML='<option value="">Selectează serverul</option>'+state.guilds.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');renderList();if(Object.keys(state.modules).length)select(Object.keys(state.modules)[0]);status('Constructorul de module este pregătit.','ok')}catch(e){status(e.message,'error')}})()})();
</script></body></html>
