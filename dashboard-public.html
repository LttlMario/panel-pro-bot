<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Pro · Dashboard public</title><style>body{margin:0;background:#07111f;color:#e8f1ff;font:16px system-ui,sans-serif}main{max-width:900px;margin:48px auto;padding:24px}header,.card{border:1px solid #24466b;border-radius:18px;background:#0b1a2d;padding:24px;box-shadow:0 12px 40px #0004}h1{margin:0 0 8px}.muted{color:#9bb2cc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:24px}.stat{padding:18px;border:1px solid #24466b;border-radius:12px;background:#0d223a}.stat strong{display:block;font-size:28px;color:#65e6d8}.error{color:#ffb4b4;background:#3b1820;border-color:#8e3542}.loading{color:#9bb2cc}</style></head><body><main><header><div class="muted">DISCORD ACTIVITY · PANEL PRO</div><h1 id="title">Dashboard public</h1><div id="subtitle" class="muted">Se încarcă statisticile sigure ale serverului…</div></header><section id="content" class="card" style="margin-top:18px"><div class="loading">Se verifică linkul public…</div></section></main><script>
const API='https://zrjxlbkbctlapgupktxw.supabase.co/functions/v1/manage-discord-bot';const KEY='sb_publishable_LfngX7pwFruPw35_ZUdO4Q_MGAHoeW0';const q=new URLSearchParams(location.search);const guild=q.get('guild_id')||'';const token=q.get('token')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const content=document.getElementById('content');async function load(){try{if(!guild||!token)throw Error('Linkul public este incomplet.');const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({action:'public_dashboard_snapshot',guild_id:guild,public_token:token})});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Dashboardul public nu este disponibil.');document.getElementById('title').textContent=data.guild_name+' · Panel Pro';document.getElementById('subtitle').textContent='Statistici agregate actualizate la '+new Date(data.generated_at).toLocaleString('ro-RO');const s=data.statistics||{};content.innerHTML='<div class="grid">'+[['active_members','Membri activi'],['shifts','Pontaje'],['active_shifts','Ture active'],['absences','Învoiri'],['operational_records','Înregistrări']].map(([k,l])=>'<div class="stat"><strong>'+esc(s[k]||0)+'</strong><span>'+l+'</span></div>').join('')+'</div><p class="muted">Acest panou afișează doar totaluri publicate de administrator. Nu sunt afișate nume sau date personale.</p>'}catch(e){content.className='card error';content.innerHTML='<strong>Nu se poate încărca dashboardul.</strong><p>'+esc(e.message)+'</p>'}}load();
</script></body></html>
