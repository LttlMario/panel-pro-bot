<!doctype html><html lang="ro" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.ico"><title>Panel Pro Bot · Administrare globală</title><link rel="stylesheet" href="css/tailwind.css"><style>:root{color-scheme:dark}.app-shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 70% 0%,#102542 0,#020617 42%,#020617 100%)}.app-header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid #1e3552;background:#050d1a}.brand{display:flex;align-items:center;gap:11px;font-weight:950}.brand img{width:34px;border-radius:10px}.brand small{display:block;color:#67e8f9;font-size:9px}.sidebar{grid-row:2/4;padding:22px 14px;border-right:1px solid #1e3552;background:#071222}.content{min-width:0;padding:28px clamp(16px,3vw,38px)}.hero,.toolbar-card,.bot-card{border:1px solid #263b58;border-radius:18px;background:linear-gradient(145deg,#101c31,#091222);padding:20px}.hero{display:flex;justify-content:space-between}.eyebrow{color:#67e8f9;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.hero h1{margin-top:6px;font-size:32px;font-weight:950}.hero p{margin-top:8px;color:#9fb0c5}.status{min-height:22px;margin:14px 2px;color:#94a3b8}.status.error{color:#fda4af}.status.ok{color:#6ee7b7}.toolbar{display:flex;gap:10px;margin:18px 0}.toolbar input{flex:1;border:1px solid #334155;border-radius:10px;background:#07101f;color:#e2e8f0;padding:11px}.button{display:inline-block;border:1px solid #36516f;border-radius:10px;background:#12243a;color:#e2e8f0;padding:10px 14px;font-size:12px;font-weight:900}.button.primary{background:#047857;border-color:#10b981}.button.cyan{background:#0e3545;border-color:#22d3ee}.bot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.bot-card h2{font-size:18px;font-weight:950}.bot-c
